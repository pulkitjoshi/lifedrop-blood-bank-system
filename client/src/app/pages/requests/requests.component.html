<header class="topbar">
  <h1>Blood Requests</h1>
  <div class="topbar-actions">
    <button class="btn" (click)="openAdd()">+ New Request</button>
  </div>
</header>

<div class="content">
  <div class="toolbar">
    <input type="text" placeholder="Search by patient or hospital..." #searchInput (input)="search.set(searchInput.value)">
    <select #statusSelect (change)="statusFilter.set(statusSelect.value)">
      <option value="">All Status</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
      <option value="fulfilled">Fulfilled</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Patient</th><th>Hospital</th><th>Blood Group</th><th>Units</th>
          <th>Urgency</th><th>Date</th><th>Status</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of filtered()">
          <td>{{ r.patientName }}</td>
          <td>{{ r.hospital }}</td>
          <td><span class="badge bg-group">{{ r.bloodGroup }}</span></td>
          <td>{{ r.units }}</td>
          <td><span class="badge" [ngClass]="'urgency-' + r.urgency">{{ urgencyLabel[r.urgency] }}</span></td>
          <td>{{ r.date | date:'mediumDate' }}</td>
          <td><span class="badge" [ngClass]="'status-' + r.status">{{ statusCap(r.status) }}</span></td>
          <td class="row-actions">
            <ng-container *ngIf="r.status === 'pending'">
              <button class="btn small green" (click)="approve(r)">Approve</button>
              <button class="btn small secondary" (click)="reject(r)">Reject</button>
            </ng-container>
            <ng-container *ngIf="r.status === 'approved'">
              <button class="btn small" (click)="fulfill(r)">Fulfill</button>
              <button class="btn small secondary" (click)="reject(r)">Cancel</button>
            </ng-container>
          </td>
        </tr>
      </tbody>
    </table>
    <p class="empty-state" *ngIf="filtered().length === 0">No requests found.</p>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal()" (click)="$event.target === $event.currentTarget && closeModal()">
  <div class="modal">
    <h2>New Blood Request</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-row">
        <label>Patient Name</label>
        <input type="text" formControlName="patientName">
      </div>
      <div class="form-row">
        <label>Hospital</label>
        <input type="text" formControlName="hospital">
      </div>
      <div class="form-grid-2">
        <div class="form-row">
          <label>Blood Group</label>
          <select formControlName="bloodGroup">
            <option *ngFor="let g of bloodGroups" [value]="g">{{ g }}</option>
          </select>
        </div>
        <div class="form-row">
          <label>Units Needed</label>
          <input type="number" formControlName="units" min="1" max="10">
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-row">
          <label>Urgency</label>
          <select formControlName="urgency">
            <option value="normal">Normal</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
        <div class="form-row">
          <label>Contact Number</label>
          <input type="tel" formControlName="contact">
        </div>
      </div>
      <p class="field-error" *ngIf="formError()">{{ formError() }}</p>
      <div class="modal-actions">
        <button type="button" class="btn secondary" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn">Submit Request</button>
      </div>
    </form>
  </div>
</div>
